runConfig:
  minInstances: 0
  maxInstances: 2
env:
  - variable: APP_ENV
    value: production
  - variable: DEPLOY_COMMIT_SHA
    value: __DEPLOY_COMMIT_SHA__
  - variable: FIREBASE_WEB_API_KEY
    secret: FIREBASE_WEB_API_KEY@1
  - variable: GOOGLE_MAPS_BROWSER_KEY
    secret: GOOGLE_MAPS_BROWSER_KEY@1
